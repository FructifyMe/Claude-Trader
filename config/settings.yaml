# ============================================================
# Auto-Trader Bot Configuration
# Change these without touching code. Bot reads on startup.
# ============================================================

strategy:
  # --- Universe Filter (daily pre-market) ---
  # Now uses Finviz full-market screens (9 different strategies)
  # + Alpaca quote validation. Finds small-caps, mid-caps, everything.
  universe:
    min_market_cap: 0                # Finviz handles per-screen (small/mid/large)
    min_avg_volume: 100_000          # 100K minimum (was 1M — opens up small caps)
    min_price: 5.0                   # Avoid penny stocks
    max_price: 500.0                 # Tradeable range for $1K
    galaxy_score_min: 50             # LunarCrush social health floor (when available)
    earnings_exclusion_days: 2       # Skip stocks reporting within N days
    max_universe_size: 100           # Expanded from 50 — more opportunities

  # --- Momentum Scoring ---
  momentum:
    sma_period: 20
    rsi_period: 14
    rsi_min: 50                      # Trending (not oversold)
    rsi_max: 70                      # Not overbought
    volume_surge_multiplier: 1.5     # Current vol vs 20-day avg
    social_volume_surge_multiplier: 2.0  # LC social vol vs 7-day avg
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    momentum_lookback_days: 5
    score_threshold: 70              # Minimum score to pass to sentiment

    # Weights (sum to 0.80 — remaining 0.20 is relative_strength + gap in code)
    weights:
      sma: 0.20
      rsi: 0.15
      volume: 0.20
      macd: 0.10
      price_momentum: 0.05
      social_volume: 0.05
      sentiment_shift: 0.05
      # relative_strength: 0.10 (hardcoded — outperformance vs SPY)
      # gap: 0.10 (hardcoded — gap-up catalyst detection)

  # --- Sentiment Confirmation ---
  sentiment:
    # LunarCrush (primary)
    lunarcrush_galaxy_min: 60
    lunarcrush_sentiment: "bullish"  # Required sentiment direction
    social_volume_trend: "rising"    # Social volume must be increasing

    # Claude Haiku (backup — only used when LC signals are mixed)
    claude_model: "claude-haiku-4-5-20251001"
    claude_confidence_min: 7         # 1-10 scale
    claude_max_tokens: 200           # Keep responses tiny

  # --- Exit Rules ---
  exits:
    stop_loss_pct: 0.05              # -5% from entry
    trailing_stop_pct: 0.03          # -3% from high water mark
    profit_target_pct: 0.10          # +10% → sell half, trail rest
    max_hold_days: 5                 # Re-evaluate after 5 days
    sentiment_reversal_exit: true    # Sell if LC flips bearish

# ============================================================
# Risk Management (HARD LIMITS — code should enforce, not suggest)
# ============================================================
risk:
  max_position_pct: 0.20            # Max 20% of portfolio per position
  max_open_positions: 5             # Max simultaneous positions
  max_daily_loss_pct: 0.03          # -3% daily → halt trading
  max_weekly_loss_pct: 0.07         # -7% weekly → halt until Monday
  max_per_trade_risk_pct: 0.01      # Risk $10 per trade on $1K
  min_cash_reserve_pct: 0.10        # Always keep 10% cash

# ============================================================
# Schedule
# ============================================================
schedule:
  scan_interval_minutes: 5
  universe_refresh_time: "09:25"    # Pre-market universe build
  market_open: "09:45"              # Skip first 15 min
  market_close: "15:45"             # Skip last 15 min
  timezone: "US/Eastern"

# ============================================================
# Logging
# ============================================================
logging:
  trade_log_path: "data/trades.json"
  daily_summary_path: "data/daily_summary"
  log_level: "INFO"                 # DEBUG for development, INFO for production
  log_decisions: true               # Log every skip/entry/exit with rationale

# ============================================================
# Strategy Learning (reinforcement from trade outcomes)
# Collects data for 7 days, then makes conservative adjustments
# ============================================================
learning:
  enabled: true
  min_days_before_adjusting: 7        # Paper trading warm-up period
  min_completed_trades: 10            # Need enough round-trip data
  max_weight_delta_per_cycle: 0.03    # Max change per weight per daily cycle
  max_weight_drift_from_original: 0.15  # Absolute cap on drift from settings.yaml
  weight_floor: 0.03                  # Minimum weight for any component
  max_screen_boost: 5.0               # Max +/- score boost per screen source
  min_screen_trades: 3                # Min completed trades before screen gets a boost
  score_threshold_min: 60             # Floor for score threshold adjustments
  score_threshold_max: 85             # Ceiling for score threshold adjustments
  revert_win_rate_floor: 0.20         # Revert to defaults if rolling win rate drops below
  revert_window_trades: 5             # Number of recent trades for revert check
  drift_decay_rate: 0.10              # Pull 10% back toward original each cycle
  adjustments_path: "data/learner_adjustments.json"
  history_path: "data/learner_history.json"
